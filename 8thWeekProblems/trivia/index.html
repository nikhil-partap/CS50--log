<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            function checkForMcq(event) {
                const button = event.target;
                if (button.innerHTML == '1 person per 6 sheep') {
                    button.style.backgroundColor = 'Green'
                    button.parentElement.querySelector('#ans').innerHTML= 'Correct'
                }else {
                    button.style.backgroundColor = 'Red'
                    button.parentElement.querySelector('#ans').innerHTML= 'Incorrect'
                }
            }
            document.addEventListener('DOMContentLoaded', function() {
                let input = document.querySelector('#check');
                input.addEventListener('click', function(event) {
                    let countryName = document.querySelector('#country');
                    let value =  countryName.value.trim()

                    if (value.toLowerCase() == 'switzerland') {
                        countryName.style.backgroundColor = 'green';
                        document.querySelector('#ans1').innerHTML = 'Correct!';
                    }
                    else {
                        countryName.style.backgroundColor = 'red';
                        document.querySelector('#ans1').innerHTML = 'Incorrect!';
                    }
                });
            });

        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>What is the approximate ratio of people to sheep in New Zealand?</h3>
                <button onclick="checkForMcq(event)" >6 people per 1 sheep</button>
                <button onclick="checkForMcq(event)" >3 people per 1 sheep</button>
                <button onclick="checkForMcq(event)" >1 person per 1 sheep</button>
                <button onclick="checkForMcq(event)" >1 person per 3 sheep</button>
                <button onclick="checkForMcq(event)" >1 person per 6 sheep</button>
                <p id="ans"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>In which country is it illegal to own only one guinea pig, as a lone guinea pig might get lonely?</h3>
                <input id="country" type="text"></input>
                <button id="check">Check Answer</button>
                <p id="ans1"></p>
            </div>
        </div>
    </body>
</html>
